name: release

# Manual only. Each job builds its packages on its own OS for the native
# binaries it carries — the Linux job builds the tarball and the .deb
# (NODE_INTERFACE → "The .deb and the tarball run the system's Node"), the
# Windows job the installer with node.exe bundled. On a tagged run the
# release job attaches every artifact to a public GitHub Release; a dry run
# builds and uploads the artifacts as workflow artifacts alone and skips
# the release job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0); leave empty for a dry run"
        required: false
      dry_run:
        description: "Build and upload artifacts only, no GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-tarball.sh
      - run: bash scripts/build-deb.sh
      - run: bash packages/web/scripts/build-release.sh
      - run: bash packages/web/scripts/build-extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            notis-node-*-linux-x64.tar.gz
            dagsocial-node_*_amd64.deb
            notis-web-*.zip
            notis-extension-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pwsh -File scripts/windows/build-bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: notis-node-*-win-x64-setup.exe

  release:
    needs: [linux, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag on a non-dry run
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo 'release job needs the tag input on a non-dry run'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Notis testnet ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: dist/**
