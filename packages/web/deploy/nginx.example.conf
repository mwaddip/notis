# Serving a Notis node, its faucet and the web client from one origin — an
# nginx vhost excerpt. The client's default is same-origin and the faucet
# answers its own origin only; the node itself answers any origin.
#
# Paths, as notis.fun lays them out:
#   /testnet/api/     → the node's HTTP API (the node listens on 127.0.0.1:3000)
#   /testnet/faucet/  → the faucet service (127.0.0.1:3100)
#   /web/             → the web client's built bundle (a static directory)
#   /web/p/<id>       → a post's standalone page, answered by the node with the
#                       client's shell and the post's preview tags
#
# The client is built with:
#   cd packages/web && VITE_PUBLIC_ORIGIN=https://notis.fun VITE_WEB_BASE=/web/ VITE_API_BASE=/testnet/api VITE_FAUCET_BASE=/testnet/faucet npx vite build
# or via packages/web/scripts/build-release.sh (those are its defaults).
# The node's environment carries WEB_SHELL_PATH=/var/www/notis.fun/web/index.html
# so that GET /shell/:id can read the client's shell.
#
# The shell the web build writes carries its own Content-Security-Policy
# meta — the one the client applies to itself. The one header a host adds
# is `frame-ancestors 'none'`, which a meta cannot forbid; it rides the
# client's two locations below. An `add_header` in a location replaces
# every `add_header` the location would otherwise inherit, so a host that
# sets other headers at the server or http level restates them inside
# these locations.

server {
    server_name notis.fun;
    listen 443 ssl;
    # ssl_certificate … ; ssl_certificate_key … ;

    # The node's HTTP API. The /testnet/api/ prefix is stripped: the node mounts
    # its routes bare.
    location /testnet/api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The faucet, a separate service under its own prefix.
    location /testnet/faucet/ {
        proxy_pass http://127.0.0.1:3100/faucet/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The web client: static files, with no catch-all rewrite to the shell.
    # A path that is not a file is a 404 — the one path the client owns beyond
    # its files is /web/p/<id>, below.
    location = /web {
        return 301 /web/;
    }
    location /web/ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        root /var/www/notis.fun;
        try_files $uri $uri/ =404;
    }

    # A post's standalone page. The node answers the client's shell with the
    # post's Open Graph tags injected (GET /shell/:id, WEB_SHELL_PATH set), so a
    # chat app previews the link and the client boots from the same response
    # and reads the path. A crawler takes the page's own URL. A regex location
    # wins over the /web/ prefix location for exactly this path. The pattern is quoted:
    # nginx reads an unquoted {64} as a block. The id is lowercase hex, the
    # ids the node answers.
    location ~ "^/web/p/([0-9a-f]{64})$" {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        proxy_pass http://127.0.0.1:3000/shell/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Without the node piece (no WEB_SHELL_PATH, or a node without the route):
    # serve the client's shell plain for the same path. The thread opens; the
    # link carries no preview. Use this block INSTEAD of the one above.
    #
    # location ~ "^/web/p/[0-9a-f]{64}$" {
    #     add_header Content-Security-Policy "frame-ancestors 'none'" always;
    #     root /var/www/notis.fun;
    #     try_files /web/index.html =404;
    # }

    # Everything else on this host is a 404.
    location / {
        return 404;
    }
}
