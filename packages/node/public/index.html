};

function updateFilterBtn() {
  const btn = document.getElementById('feedFilterBtn');
  // `.on` carries the fill and the text on it together — an inline background
  // alone would leave the label the same colour as its own fill.
  if (feedFilter === userId) {
    btn.textContent = 'My posts';
    btn.classList.add('on');
  } else if (feedFilter !== 'all') {
    btn.textContent = "Author's posts";
    btn.classList.add('on');
  } else {
    btn.textContent = 'All posts';
    btn.classList.remove('on');
  }
}

function showProfileBar(authorHex, label) {
  const bar = document.getElementById('profileBar');
  document.getElementById('profileName').textContent = label;
  bar.style.display = 'flex';
  // Vouch controls (hidden for own identity)
  const isOwn = userId && authorHex === userId;
  document.getElementById('vouchBtn').style.display = (userId && !isOwn) ? '' : 'none';
  document.getElementById('unvouchBtn').style.display = 'none';
  document.getElementById('vouchStatus').textContent = '';
  if (userId && !isOwn) checkVouchStatus(authorHex);
}

function hideProfileBar() {
  document.getElementById('profileBar').style.display = 'none';
}

/**
 * The active vouch this identity holds on `targetId`, or null.
 *
 * `?voucher=`, never `?target=`: only the voucher arm carries `boxId`, and an
 * unvouch spends a NAMED box. The target arm answers the display question and
 * leaves the button it enables unable to act.
 */
async function fetchOwnVouch(targetId) {
  const res = await fetch(API + '/vouches?voucher=' + encodeURIComponent(userId));
  if (!res.ok) return null;
  const data = await res.json();
  return (data.vouches || []).find(v => v.targetId === targetId) || null;
}

async function checkVouchStatus(targetId) {
  try {
    if (await fetchOwnVouch(targetId)) {
      document.getElementById('vouchBtn').style.display = 'none';
      document.getElementById('unvouchBtn').style.display = '';
    }
  } catch {}
}

document.getElementById('vouchBtn').addEventListener('click', async () => {
  if (!userId || feedFilter === 'all' || feedFilter === userId) return;
  const btn = document.getElementById('vouchBtn');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox || karmaBox.total < VOUCH_MIN_BALANCE) {
      document.getElementById('vouchStatus').textContent =
        `need ${VOUCH_MIN_BALANCE} karma to vouch`;
      return;
    }

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildVouchTx(karmaBox, feedFilter, pubKeyHex);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/vouches', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    document.getElementById('vouchStatus').textContent = res.ok ? 'Vouched!' : (data.reason || data.error || 'failed');
    if (res.ok) {
      btn.style.display = 'none';
      document.getElementById('unvouchBtn').style.display = '';
    }
  } catch (e) {
    document.getElementById('vouchStatus').textContent = 'error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Vouch';
  }
});

document.getElementById('unvouchBtn').addEventListener('click', async () => {
  if (!userId || feedFilter === 'all') return;
  const btn = document.getElementById('unvouchBtn');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    // Read at click time rather than caching what `checkVouchStatus` saw: the
    // box can be spent between opening the profile and pressing the button,
    // and a stale id names an input the node will not find.
    const vouch = await fetchOwnVouch(feedFilter);
    if (!vouch) {
      document.getElementById('vouchStatus').textContent = 'no active vouch';
      return;
    }

    const pubKeyHex = buf2hex(pubKeyRaw);
    // The stake as the node reports it, never the constant — see
    // `buildUnvouchTx`. `BigInt` because the listing carries it as a decimal
    // string, like every other value on this API.
    // ⛔ `+ 1` because this transaction is POOLED: it applies at the next height
    // at the earliest, and the engine's floor is read at the height that carries
    // it. Overshooting is legal — only the floor is a rule.
    const tx = buildUnvouchTx(
      vouch.boxId,
      BigInt(vouch.value),
      pubKeyHex,
      currentBlockHeight + 1 + vouchCooldownBlocks,
    );
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/vouches/' + encodeURIComponent(feedFilter), {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    document.getElementById('vouchStatus').textContent = res.ok ? 'Unvouched.' : (data.reason || data.error || 'failed');
    if (res.ok) {
      btn.style.display = 'none';
      document.getElementById('vouchBtn').style.display = '';
    }
  } catch (e) {
    document.getElementById('vouchStatus').textContent = 'error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unvouch';
  }
});

document.getElementById('profileBackBtn').addEventListener('click', () => {
  feedFilter = 'all';
  hideProfileBar();
  updateFilterBtn();
  loadFeed();
});

// ===========================================================================
// Like flow (tx-based; a like is a one-way burn, there is no unlike)
// ===========================================================================

async function doLike(targetPostId) {
  try {
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      setStatus('No karma box — cannot like', 'error');
      return false;
    }
    if (karmaBox.total < LIKE_KARMA_COST) {
      setStatus(`Insufficient karma to like: need ${LIKE_KARMA_COST}, have ${karmaBox.total}`, 'error');
      return false;
    }

    // ⛔ **The consensus author, fetched rather than taken off the feed.** The
    // marker names it and the engine pins it against `block_topology`, so the
    // DAG's `author` is the wrong source even when it agrees
    // (NODE_INTERFACE → Karma transition rules). `null` means no block has
    // confirmed the post, and a like on an unconfirmed post is unbuildable —
    // the marker has no author to name.
    const postRes = await fetch(API + '/posts/' + encodeURIComponent(targetPostId));
    const confirmedAuthor = postRes.ok ? (await postRes.json()).confirmedAuthor : null;
    if (!confirmedAuthor) {
      setStatus('Post not confirmed yet — a like names its author, so wait a block', 'error');
      return false;
    }

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildLikeTx(karmaBox, targetPostId, pubKeyHex, confirmedAuthor);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/likes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (!res.ok) {
      setStatus(data.reason || data.error || 'like failed', 'error');
      return false;
    }

    // Liking twice before a block lands is the same sequence as post-then-like:
    // the second like spends this one's change.
    recordPendingKarmaChange(tx);
    return true;
  } catch (e) {
    setStatus('like error: ' + e.message, 'error');
    return false;
  }
}

// ===========================================================================
// Feed
// ===========================================================================

/**
 * Format a Unix-ms timestamp as a relative time string ("2m ago", "3h ago").
 * Returns absolute date/time as the title attribute for hover.
 */
function formatRelativeTime(ts) {
  const now = Date.now();
  const diff = now - ts;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);

  let relative;
  if (seconds < 60) relative = 'just now';
  else if (minutes < 60) relative = `${minutes}m ago`;
  else if (hours < 24) relative = `${hours}h ago`;
  else if (days < 7) relative = `${days}d ago`;
  else relative = new Date(ts).toLocaleDateString();

  const absolute = new Date(ts).toLocaleString();
  return { relative, absolute };
}

function renderPost(p, id, depth, highlighted = false) {
  const shortId = id.slice(0, 16);
  const liked = userId && p.likers && p.likers.includes(userId);
  const likeCount = typeof p.likeCount === 'number' ? p.likeCount : 0;
  const indent = depth * 20;
  const isOwn = userId && p.author === userId;
  const deleteBtn = isOwn
    ? `<button class="like-btn delete-btn" data-post-id="${id}" style="color:var(--clay)">&#10005; Delete</button>`
    : '';
  const { relative, absolute } = formatRelativeTime(p.timestamp);
  const hlClass = highlighted ? ' post-highlighted' : '';
  return `
    <div class="post${hlClass}" data-post-id="${id}" style="margin-left:${indent}px;border-left:${depth > 0 ? '2px solid var(--border)' : 'none'};padding-left:${depth > 0 ? '10px' : '12px'}">
      <div class="post-author" style="cursor:pointer" onclick="event.stopPropagation();viewProfile('${esc(p.author)}')" title="View posts by this author">${esc(p.author.slice(0, 12))}...</div>
      <div class="post-content">${escWithBreaks(p.content)}</div>
      <div class="post-meta">
        <a class="permalink" onclick="event.stopPropagation();loadThread('${esc(id)}')" title="${esc(absolute)}">${esc(relative)}</a>
        <span>${p.parentRefs.length ? p.parentRefs.length + ' parent(s)' : 'genesis'}</span>
        <span style="font-family:monospace;font-size:10px">${esc(shortId)}...</span>
        <button class="like-btn reply-btn" data-post-id="${id}">&#8617; Reply</button>
        <button class="like-btn${liked ? ' liked' : ''}" data-post-id="${id}" data-liked="${liked ? '1' : '0'}"${liked || pendingLikes.has(id) ? ' disabled' : ''}>
          ${pendingLikes.has(id)
            ? '<span class="spinner"></span>Pending...'
            : (liked ? '&#10084;&#65039; Liked' : '&#10084;&#65039; Like') + ` (${likeCount})`}
        </button>
        ${deleteBtn}
      </div>
    </div>
  `;
}

function renderThread(roots, postMap, children, depth) {
  const sorted = [...roots].sort((a, b) => b.timestamp - a.timestamp);
  return sorted.map(p => {
    const id = computePostId(p);
    const childPosts = (children.get(id) || []).sort((a, b) => a.timestamp - b.timestamp);
    return renderPost(p, id, depth) + renderThread(childPosts, postMap, children, depth + 1);
  }).join('');
}

async function loadFeed() {
  const feed = document.getElementById('feed');
  try {
    let url = API + '/posts?limit=50';
    if (feedFilter !== 'all') url += '&author=' + feedFilter;
    const res = await fetch(url);
    const posts = await res.json();
    if (!posts.length) { feed.innerHTML = '<div class="empty">No posts yet. Write something!</div>'; return; }

    // Build post map and children index
    const postMap = new Map();
    const children = new Map();
    for (const p of posts) {
      const id = computePostId(p);
      postMap.set(id, p);
    }
    for (const p of posts) {
      const id = computePostId(p);
      for (const parentId of p.parentRefs) {
        if (postMap.has(parentId)) {
          if (!children.has(parentId)) children.set(parentId, []);
          children.get(parentId).push(p);
        }
      }
    }

    // Roots: posts whose parentRefs are empty or none are in the fetched set
    const rootPosts = posts.filter(p => {
      if (!p.parentRefs.length) return true;
      return !p.parentRefs.some(pid => postMap.has(pid));
    });

    feed.innerHTML = renderThread(rootPosts, postMap, children, 0) ||
      '<div class="empty">No root posts found. Try posting something!</div>';

    // Attach reply/like/delete handlers
    attachFeedHandlers(feed);
  } catch (e) {
    feed.innerHTML = '<div class="empty">Failed to load feed</div>';
  }
}

// ===========================================================================
// Thread view (permalink)
// ===========================================================================

/** Currently viewed thread post ID, or null if showing the normal feed. */
let threadPostId = null;

/**
 * Fetch and render a single post with its full thread context.
 * Pushes state to browser history for permalink sharing and back-button support.
 */
async function loadThread(postId, pushState = true) {
  threadPostId = postId;
  const feed = document.getElementById('feed');

  if (pushState) {
    const url = new URL(window.location.href);
    url.searchParams.set('post', postId);
    window.history.pushState({ postId }, '', url.toString());
  }

  try {
    const res = await fetch(API + '/posts/' + encodeURIComponent(postId) + '/thread');
    if (!res.ok) {
      feed.innerHTML = '<div class="empty">Post not found.</div>';
      return;
    }
    const thread = await res.json();

    // Build ancestors HTML (straight line, oldest first → immediate parent)
    let ancestorsHtml = '';
    if (thread.ancestors && thread.ancestors.length > 0) {
      const parts = [];
      for (const a of thread.ancestors) {
        const aid = computePostId(a);
        parts.push(renderPost(a, aid, 0, false));
        parts.push('<div class="ancestor-connector">↓</div>');
      }
      ancestorsHtml = parts.join('');
    }

    // Target post (highlighted)
    const targetHtml = renderPost(thread.post, postId, 0, true);

    // Build descendants threaded view
    let descendantsHtml = '';
    if (thread.descendants && thread.descendants.length > 0) {
      const allDesc = [...thread.descendants];
      // Include target in the map so children refs to target resolve
      const allPosts = [...allDesc, thread.post];

      const postMap = new Map();
      const children = new Map();
      for (const p of allPosts) {
        const pid = computePostId(p);
        postMap.set(pid, p);
      }
      for (const p of allDesc) {
        const pid = computePostId(p);
        for (const parentId of p.parentRefs) {
          if (postMap.has(parentId)) {
            if (!children.has(parentId)) children.set(parentId, []);
            children.get(parentId).push(p);
          }
        }
      }

      // Roots of the descendant tree: posts whose parents are all outside the
      // descendant set (i.e., their only parent in our map is the target post)
      const rootDesc = allDesc.filter(p => {
        if (!p.parentRefs.length) return false;
        return p.parentRefs.every(pid => !postMap.has(pid) || pid === postId);
      });

      if (rootDesc.length > 0) {
        descendantsHtml = renderThread(rootDesc, postMap, children, 1);
      }
    }

    const previewUrl = `${API}/preview/${encodeURIComponent(postId)}`;

    feed.innerHTML = `
      <div class="thread-header">
        <button id="threadBackBtn" class="small">← Back to feed</button>
        <button id="copyLinkBtn" class="small" style="background:var(--border)">Copy link</button>
        <span id="copyLinkMsg" style="font-size:11px;color:var(--greenText);display:none">Copied!</span>
      </div>
      ${ancestorsHtml}
      ${targetHtml}
      ${descendantsHtml ? '<div style="margin-top:8px"></div>' + descendantsHtml : ''}
    `;

    // Back button handler
    document.getElementById('threadBackBtn').addEventListener('click', () => {
      window.history.back();
    });

    // Copy link handler
    document.getElementById('copyLinkBtn').addEventListener('click', async () => {
      try {
        const fullUrl = new URL(previewUrl, window.location.href).toString();
        await navigator.clipboard.writeText(fullUrl);
        const msg = document.getElementById('copyLinkMsg');
        msg.style.display = '';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      } catch {
        // Fallback for older browsers
        const input = document.createElement('input');
        input.value = new URL(previewUrl, window.location.href).toString();
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
      }
    });

    // Attach reply/like/delete handlers (same pattern as loadFeed)
    attachFeedHandlers(feed);
  } catch (e) {
    feed.innerHTML = '<div class="empty">Failed to load thread</div>';
  }
}

// Expose for inline onclick handlers (module scripts don't create globals)
window.loadThread = loadThread;

/** Clear thread view and return to normal feed. Called on popstate back to feed. */
function clearThread() {
  threadPostId = null;
  loadFeed();
}

// ===========================================================================
// Feed event handler attachment (shared between feed and thread views)
// ===========================================================================

function attachFeedHandlers(container) {
  container.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const postId = btn.dataset.postId;
      if (!postId) return;
      const input = document.getElementById('parents');
      const current = input.value.trim();
      input.value = current ? current + ', ' + postId : postId;
      input.scrollIntoView({ behavior: 'smooth' });
      input.focus();
    });
  });

  container.querySelectorAll('.like-btn:not(.reply-btn):not(.delete-btn)').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.postId;
      const isLiked = btn.dataset.liked === '1';
      // A like is a one-way burn: once liked, the button is inert.
      if (!postId || isLiked) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Pending...';
      pendingLikes.add(postId);

      const ok = await doLike(postId);
      if (ok) {
        loadIdentityStatus();
      }

      pendingLikes.delete(postId);
      btn.disabled = false;
      // Refresh the current view
      if (threadPostId) loadThread(threadPostId, false);
      else loadFeed();
    });
  });

  container.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const postId = btn.dataset.postId;
      if (!postId || !userId || !privKey) return;

      if (!confirm('Delete this post and all replies? This will return any locked karma to each reply author.')) {
        return;
      }

      btn.disabled = true;
      btn.textContent = '...';

      try {
        const chalRes = await fetch(API + '/challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId }),
        });
        if (!chalRes.ok) {
          throw new Error('Failed to get challenge');
        }
        const { challenge } = await chalRes.json();

        const chalBytes = hex2buf(challenge);
        const hash = blake2b(chalBytes, null, 64).slice(0, 32);
        const sigBuf = await crypto.subtle.sign('Ed25519', privKey, hash);
        const signature = buf2hex(new Uint8Array(sigBuf));

        const res = await fetch(API + '/posts/' + encodeURIComponent(postId), {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ authorId: userId, challenge, signature }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Delete failed');
        }

        const result = await res.json();
        console.log('Post deleted:', result);
        if (threadPostId) {
          // If the deleted post was the thread target, go back to feed
          if (threadPostId === postId) window.history.back();
          else loadThread(threadPostId, false);
        } else {
          loadFeed();
        }
      } catch (e) {
        console.error('Delete failed:', e);
        alert('Delete failed: ' + (e.message || 'unknown error'));
        btn.disabled = false;
        btn.textContent = '✕ Delete';
      }
    });
  });
}

async function loadIdentityStatus() {
  if (!userId) return;
  const karmaEl = document.getElementById('identityKarma');
  const creditsEl = document.getElementById('identityCredits');

  try {

    if (res.ok) {
      const data = await res.json();
      const total = BigInt(data.total);
      karmaEl.textContent = total.toString();
      // Green is karma, gold is credits — the two-ledger mapping, and gold means nothing else.
      karmaEl.style.color = total > 0n ? 'var(--greenText)' : 'var(--inkMute)';
    } else {
      karmaEl.textContent = '0';
      karmaEl.style.color = 'var(--inkMute)';
    }
  } catch {
    karmaEl.textContent = '—';
    karmaEl.style.color = 'var(--inkMute)';
  }

  try {
    const res = await fetch(API + '/credits/' + encodeURIComponent(userId));
    if (res.ok) {
      const data = await res.json();
      const total = BigInt(data.total);
      creditsEl.textContent = formatCredits(total);
      creditsEl.style.color = total > 0n ? 'var(--gold)' : 'var(--inkMute)';
    } else {
      creditsEl.textContent = '0';
      creditsEl.style.color = 'var(--inkMute)';
    }
  } catch {

    creditsEl.style.color = 'var(--inkMute)';
  }
}

async function loadStatus() {
  const bar = document.getElementById('statusBar');
  try {
    const res = await fetch(API + '/status');
    if (!res.ok) { bar.innerHTML = 'Status unavailable'; return; }
    const s = await res.json();
    // Defaulting the UI to mainnet is deliberate and stays: on a missing field
    // it hides the debug surfaces, which is the safe failure direction.
    networkType = s.networkType || 'mainnet';
    currentBlockHeight = s.blockHeight || 0;
    // `??`, not `||`: a served `0` is a legal cooldown and must not fall back.
    vouchCooldownBlocks = s.vouchCooldownBlocks ?? vouchCooldownBlocks;

    bar.innerHTML = `
      <div><span>Network:</span> <strong style="color:${networkType === 'testnet' ? 'var(--inkMute)' : networkType === 'devnet' ? 'var(--clay)' : 'var(--greenText)'}">${esc(networkType)}</strong></div>
      <div><span>Block height:</span> <strong>${s.blockHeight}</strong></div>
      <div><span>Posts (confirmed / pending):</span> <strong>${s.postCount} / ${s.pendingPosts}</strong></div>
      <div><span>Total karma:</span> <strong>${s.totalKarma}</strong> &nbsp; <span>Total credits:</span> <strong>${formatCredits(BigInt(s.totalCredits))}</strong></div>
    `;

    // Show the admin section on every network but mainnet. A deny-list, and
    // safe as one because nothing on this page mints: every panel below builds
    // an ordinary user transaction, so one shown a network too early is a
    // button the node refuses, not karma from nothing.
    const admin = document.getElementById('adminSection');
    admin.style.display = networkType !== 'mainnet' ? '' : 'none';
  } catch (e) {
    bar.innerHTML = 'Status unavailable';
  }
}

// ===========================================================================
// Admin / Debug - Credit Transfer
// ===========================================================================

function buildCreditTransferTx(creditBoxes, recipientHex, amount) {
  const unlocked = creditBoxes.boxes.filter(b =>
    !b.lockedUntilBlock || b.lockedUntilBlock <= currentBlockHeight
  );
  const selected = selectBoxes(unlocked, amount);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const change = selectedTotal - amount;

  const outputs = [{
    boxType: 'credit',
    value: amount,
    owner: recipientHex,
  }];
  if (change > 0n) {
    outputs.push({
      boxType: 'credit',
      value: change,
      owner: buf2hex(pubKeyRaw),
    });
  }

  return {
    inputs: selected.map(b => b.boxId),
    outputs,
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

document.getElementById('creditTransferBtn').addEventListener('click', async () => {
  const btn = document.getElementById('creditTransferBtn');
  const result = document.getElementById('creditTransferResult');
  const recipient = document.getElementById('creditTransferRecipient').value.trim();
  // Input is whole credits; the ledger counts 10⁻⁸-credit base units.
  let amount;
  try { amount = BigInt(document.getElementById('creditTransferAmount').value.trim() || '0') * CREDIT_SCALE; }
  catch { amount = 0n; }

  if (!recipient || recipient.length !== 64) {
    result.innerHTML = '<span class="result-msg err">Recipient must be a 64-character hex user ID</span>';
    return;
  }
  if (amount < 1n) {
    result.innerHTML = '<span class="result-msg err">Amount must be at least 1</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Building transaction...</span>';

  try {
    const creditBoxes = await fetchCreditBoxes();
    if (!creditBoxes || creditBoxes.total < amount) {
      result.innerHTML = `<span class="result-msg err">Insufficient credits: have ${formatCredits(creditBoxes?.total ?? 0n)}, need ${formatCredits(amount)}</span>`;
      btn.disabled = false;
      return;
    }

    // The node takes the transaction we just built and signed — it validates
    // and pools it; the credits move when the transaction is mined.
    const tx = buildCreditTransferTx(creditBoxes, recipient, amount);
    const { signature } = await signTxId(tx);
    const pubKeyHex = buf2hex(pubKeyRaw);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/credits/transfer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });

    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `<span class="result-msg ok">Transfer of ${formatCredits(amount)} credits pending — settles at the next block. TxId: ${(data.txId || '').slice(0, 16)}...</span>`;
      loadIdentityStatus();
      loadStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'transfer failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

// ===========================================================================
// Admin / Debug - Invites (tx-based)
// ===========================================================================

document.getElementById('createInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('createInviteBtn');
  const result = document.getElementById('inviteResult');
  // Lowercased before the shape test because `b32Hex` accepts lowercase only —
  // the two forms decode to the same bytes, so accepting both there would make
  // the hex boundary non-injective. Refusing them here instead of at the encoder
  // is what turns a pasted uppercase key into an accepted invite.
  const inviteeHex = document.getElementById('inviteePublicKeyInput').value.trim().toLowerCase();

  if (!/^[0-9a-f]{64}$/.test(inviteeHex)) {
    result.innerHTML = '<span class="result-msg err">Invitee public key must be 64 hex characters (an Ed25519 public key)</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Creating invite...</span>';

  try {
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      result.innerHTML = '<span class="result-msg err">No karma box found</span>';
      return;
    }
    // Advisory — `createInvite` owns the verdict, and it also owns the one
    // rejection this page cannot predict: the named key already being an
    // account. The bond is the whole cost; the claim mints the rest.
    if (karmaBox.total < INVITE_BOND_DEFAULT) {
      result.innerHTML = `<span class="result-msg err">Insufficient karma: the bond is ${INVITE_BOND_DEFAULT}, you hold ${karmaBox.total}</span>`;
      return;
    }

    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildCreateInviteTx(karmaBox, pubKeyHex, inviteeHex);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/invites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `
        <span class="result-msg ok">Invite created!</span>
        <div style="font-size:11px;color:var(--inkMute);margin:4px 0">Invite Box ID (the invitee claims this):</div>
        <pre>${esc(data.inviteBoxId)}</pre>
        <div style="font-size:11px;color:var(--inkMute);margin:4px 0">Bond Box ID:</div>
        <pre>${esc(data.bondBoxId)}</pre>
        <div style="font-size:11px;color:var(--inkMute);margin:4px 0">Invitee:</div>
        <pre>${esc(inviteeHex)}</pre>
      `;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'invite creation failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('claimInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('claimInviteBtn');
  const result = document.getElementById('claimResult');
  const inviteBoxId = document.getElementById('inviteBoxIdInput').value.trim();

  if (!inviteBoxId) {
    result.innerHTML = '<span class="result-msg err">Invite Box ID is required</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Claiming invite...</span>';

  try {
    // One step and one signature — the invitee's. The id is the whole of what
    // the inviter passes on: no secret exists, and the bond is not this
    // transaction's to name.
    const inviteePubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildClaimInviteTx(inviteBoxId, inviteePubKeyHex);
    const { signature } = await signTxId(tx);
    tx.signatures[inviteePubKeyHex] = signature;

    const res = await fetch(API + '/invites/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `
        <span class="result-msg ok">Invite claimed!</span>
        <div style="font-size:11px;color:var(--inkMute);margin:4px 0">User ID:</div>
        <pre>${esc(data.userId)}</pre>
        <div style="font-size:11px;color:var(--inkMute);margin:4px 0">Karma Box ID:</div>
        <pre>${esc(data.karmaBoxId)}</pre>
      `;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'claim failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('cancelInviteBtn').addEventListener('click', async () => {
  const btn = document.getElementById('cancelInviteBtn');
  const result = document.getElementById('cancelInviteResult');
  const inviteBoxId = document.getElementById('cancelInviteBoxIdInput').value.trim();

  if (!inviteBoxId) {
    result.innerHTML = '<span class="result-msg err">Invite Box ID is required</span>';
    return;
  }

  btn.disabled = true;
  result.innerHTML = '<span class="result-msg">Cancelling invite...</span>';

  try {
    // Resolved against the signer's own open invites first: only the inviter
    // may cancel, and "not one of yours" is a clearer answer than the 403 a
    // signature check gives. `cancelInvite` owns the verdict either way.
    const inviteState = await fetchInviteState();
    if (!inviteState.open.some(b => b.id === inviteBoxId)) {
      result.innerHTML = `<span class="result-msg err">Invite ${inviteBoxId.slice(0, 16)}... is not one of your open invites</span>`;
      return;
    }

    // The bond is not named: it returns to the inviter through block
    // application, and no user transaction can spend one.
    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildCancelInviteTx(inviteBoxId);
    const { signature } = await signTxId(tx);
    tx.signatures[pubKeyHex] = signature;

    const res = await fetch(API + '/invites/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    const data = await res.json();
    if (res.ok) {
      result.innerHTML = `<span class="result-msg ok">Invite cancelled! TxId: ${(data.txId || '').slice(0, 16)}...</span>`;
      loadStatus();
      loadIdentityStatus();
    } else {
      result.innerHTML = `<span class="result-msg err">${esc(data.reason || data.error || 'cancel failed')}</span>`;
    }
  } catch (e) {
    result.innerHTML = `<span class="result-msg err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

// ===========================================================================
// Init
// ===========================================================================

await loadIdentities();

// Check for ?post= permalink on initial load
const initialParams = new URLSearchParams(window.location.search);
const initialPostId = initialParams.get('post');
if (initialPostId) {
  // Replace state so the initial history entry has the postId
  window.history.replaceState({ postId: initialPostId }, '', window.location.href);
  loadThread(initialPostId, false);
} else {
  loadFeed();
}
loadStatus();

// Handle browser back/forward
window.addEventListener('popstate', (event) => {
  const state = event.state;
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('post');
  if (postId) {
    loadThread(postId, false);
  } else {
    clearThread();
  }
});

// Auto-refresh (skipped when viewing a thread)
setInterval(() => {
  if (!threadPostId) loadFeed();
  loadStatus();
}, 5000);
setInterval(loadStatus, 15000);
</script>
