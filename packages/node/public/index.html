<!DOCTYPE html>
<html lang="en" class="no-anim">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notis DEMO UI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* Not deferred, on purpose: `data-theme` has to be on <html> before the first paint, or a
   stored preference is transitioned into instead of painted — HOUSE_STYLE.md → Motion. */
(function(){
  var root=document.documentElement, STORE="notis-theme";
  function stored(){ try{ var t=localStorage.getItem(STORE); return t==="dark"||t==="light"?t:null; }
    catch(e){ return null; } }   // private mode, disabled storage — not an error worth raising
  function resolve(){
    var saved=stored(); if(saved) return saved;
    return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  /* The control names and shows the theme it would switch TO, lowercase, because the
     surrounding labels are lowercase. */
  function apply(theme, remember){
    root.setAttribute("data-theme", theme);
    if(remember){ try{ localStorage.setItem(STORE, theme); }catch(e){} }
    var btn=document.getElementById("themeToggle");
    if(btn){ var other = theme==="dark" ? "light" : "dark";
      btn.textContent=other; btn.setAttribute("aria-label","Switch to "+other+" theme"); } }

  apply(resolve(), false);   // not remembered: nobody has chosen yet

  document.addEventListener("DOMContentLoaded", function(){
    apply(root.getAttribute("data-theme"), false);   // label the control now that it exists
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ root.classList.remove("no-anim"); }); });
    var btn=document.getElementById("themeToggle");
    if(btn) btn.addEventListener("click", function(){
      apply(root.getAttribute("data-theme")==="dark" ? "light" : "dark", true); });
  });
})();
</script>
<style>
/* ---------- faces ----------
   Self-hosted, always: HOUSE_STYLE.md → Typography. Copied into this package rather than
   served from docs/site — the demo UI takes no runtime dependency outside the workspace. */
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400 700;font-display:swap;
           src:url('fonts/Plus-Jakarta-Sans.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:swap;
           src:url('fonts/JetBrains-Mono.woff2') format('woff2')}

/* ---------- tokens ----------
   Sand is the primary ground; Bistre is the dark theme. Every value was solved numerically
   for its contrast target at a held hue — copy them from HOUSE_STYLE.md → Colour, never
   nudge one by eye. */
:root{
  --ground:#E7DCC6; --surface:#EFE7D5; --border:#CFC1A6; --borderStrong:#8B7A61;
  --ink:#2A2419; --inkMute:#696051;
  --green:#5E8C3A; --greenText:#476A2C; --onGreen:#FAF6EC;
  --gold:#7F5A1C; --goldFill:#9B762D; --clay:#9A4A2F; --keyline:#1B2A12;
  --notis-green:var(--green); --notis-keyline:var(--keyline);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  /* Fixed handles for both grounds: the theme control renders the ground it would switch to,
     so it needs the other palette whichever one is active. */
  --sand:#E7DCC6; --sand-ink:#2A2419; --bistre:#211E18; --bistre-ink:#E9E1CF;
}
:root[data-theme="dark"]{
  --ground:#211E18; --surface:#2A261D; --border:#3D3830; --borderStrong:#7A6E5C;
  --ink:#E9E1CF; --inkMute:#978B77;
  --greenText:#679A40; --onGreen:#141A0C; --gold:#B78328; --goldFill:#E8B84B; --clay:#CC7658;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#211E18; --surface:#2A261D; --border:#3D3830; --borderStrong:#7A6E5C;
    --ink:#E9E1CF; --inkMute:#978B77;
    --greenText:#679A40; --onGreen:#141A0C; --gold:#B78328; --goldFill:#E8B84B; --clay:#CC7658;
  }
}

/* The head script sets data-theme before the first paint; this holds transitions off for the
   frames until it has, so a restored preference is painted and not animated into. */
.no-anim *{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
  display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background-color .15s ease,color .15s ease}
::selection{background:var(--greenText);color:var(--onGreen)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--greenText);outline-offset:2px}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-thumb{background:var(--border)}
.panel::-webkit-scrollbar-track{background:transparent}

.panel{padding:22px;overflow-y:auto;position:relative;z-index:2}
.left{width:430px;min-width:430px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:15px;background:var(--surface)}
.left>*{flex-shrink:0}
.right{flex:1}

/* Rows mixing the two faces align on the baseline, never centred: flex centring positions each
   item by its box, so the result depends on each family's ascent and descent metrics. */
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.brand svg{width:22px;height:22px;flex:none;align-self:center}
.brand b{font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.brand b i{font-style:normal;font-weight:400;color:var(--inkMute)}
.brand .tag{margin-left:auto;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--inkMute)}
.brand .tag u{width:6px;height:6px;border-radius:50%;background:var(--greenText);display:inline-block;margin-right:6px;vertical-align:1px}

/* Styled as the inverse of the active ground and labelled with the theme it would switch to,
   so appearance and label agree and it explains itself without an icon anyone has to learn. */
.theme-toggle{position:fixed;top:14px;right:16px;z-index:950;padding:7px 13px;
  font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;line-height:1;
  border:1px solid var(--bistre);background:var(--bistre);color:var(--bistre-ink);cursor:pointer;
  transition:opacity .15s ease}
.theme-toggle:hover{opacity:.86}
:root[data-theme="dark"] .theme-toggle{background:var(--sand);color:var(--sand-ink);border-color:var(--sand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-toggle{background:var(--sand);color:var(--sand-ink);border-color:var(--sand)}}

/* The `//` is this surface's one deliberate departure — it marks the debug UI. It is the only
   one: HOUSE_STYLE.md → Principles 5, the charm reads because the baseline is sober. */
h2{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin-bottom:8px;display:flex;align-items:baseline;gap:9px}
h2::before{content:"//";color:var(--greenText)}
h3{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--inkMute);margin:11px 0 4px}
h4{font-size:11.5px;letter-spacing:.02em;color:var(--inkMute);margin:8px 0 3px;font-weight:600}

/* Fields carry ids, hex and amounts, so they are mono; the compose box carries prose and is
   not. A placeholder is human copy either way. */
textarea,input,select{width:100%;background:var(--ground);border:1px solid var(--borderStrong);color:var(--ink);
  font-size:12.5px;font-family:var(--mono);padding:10px 11px;transition:border-color .15s ease}
textarea{height:120px;min-height:120px;resize:vertical;line-height:1.55;font-family:var(--sans);font-size:14px}
input,select{height:36px}
select{cursor:pointer;font-family:var(--sans);font-size:13px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ink)}
::placeholder{color:var(--inkMute);font-family:var(--sans);opacity:1}

/* A ghost control: the border is its sole boundary, which is what earns borderStrong
   (HOUSE_STYLE.md → Accessibility contract). */
button{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;
  letter-spacing:0;text-transform:none;padding:8px 14px;border:1px solid var(--borderStrong);color:var(--ink);
  background:none;cursor:pointer;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button.small{padding:6px 10px;font-size:11.5px}
/* An engaged filter is a green fill, so its label takes onGreen — the fill and the text on it
   move together, which an inline background alone cannot do. */
button.on{background:var(--greenText);color:var(--onGreen);border-color:var(--greenText)}
button.on:hover{border-color:var(--greenText);opacity:.88}
/* Clay separates warning from destructive by weight, not by a second hue: full rule here,
   soft tint on the hover. */
button.danger{border-color:var(--clay);color:var(--clay)}
button.danger:hover{border-color:var(--clay);background:color-mix(in srgb,var(--clay) 12%,transparent)}

.id-badge{font-family:var(--mono);font-size:11.5px;color:var(--inkMute);background:var(--ground);border:1px solid var(--border);padding:9px 10px;word-break:break-all}
.status-bar{background:var(--ground);border:1px solid var(--border);padding:11px 12px;font-size:13px;line-height:1.75}
.status-bar span{color:var(--inkMute)}
.status-bar strong{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:12px}

/* Not controls, so their outline is the semantic hue at reduced weight rather than a border
   token. Busy is neither warning nor error: clay would misreport it and gold means credits. */
.status{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border:1px solid}
.status-ok{color:var(--greenText);border-color:color-mix(in srgb,var(--greenText) 45%,transparent);background:color-mix(in srgb,var(--greenText) 10%,transparent)}
.status-busy{color:var(--inkMute);border-color:var(--border);background:none}
.status-error{color:var(--clay);border-color:color-mix(in srgb,var(--clay) 45%,transparent);background:color-mix(in srgb,var(--clay) 10%,transparent)}

.empty{color:var(--inkMute);font-style:italic;padding:22px;text-align:center}
.row{display:flex;gap:8px;align-items:baseline}
.row label{font-size:12.5px;color:var(--inkMute);white-space:nowrap}

.like-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);color:var(--inkMute);cursor:pointer;font-size:11.5px;font-family:var(--sans);font-weight:500;letter-spacing:0;padding:2px 9px;text-transform:none;transition:border-color .15s ease,color .15s ease,background-color .15s ease}
.like-btn:hover{border-color:var(--borderStrong);color:var(--ink)}
.like-btn:disabled{opacity:.45;cursor:not-allowed}
.like-btn.liked{border-color:var(--greenText);color:var(--greenText);background:color-mix(in srgb,var(--greenText) 10%,transparent)}
/* A pending like is reported, not animated: an indefinite spin is ambient motion, and under
   prefers-reduced-motion it would freeze mid-rotation and read as damage. */
.like-btn .spinner{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--inkMute);margin-right:5px;vertical-align:middle}

pre{background:var(--ground);border:1px solid var(--border);padding:9px 10px;font-size:11.5px;font-family:var(--mono);color:var(--ink);overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:5px 0;line-height:1.7}
.result-msg{font-size:12px;padding:4px 0;color:var(--inkMute)}
.result-msg.ok{color:var(--greenText)}
.result-msg.err{color:var(--clay)}
hr{border:none;border-top:1px solid var(--border);margin:6px 0}

.post{position:relative;border:1px solid var(--border);padding:14px 16px;margin-bottom:11px;background:var(--surface);transition:border-color .15s ease}
.post:hover{border-color:var(--borderStrong)}
.post-author{font-family:var(--mono);font-size:11.5px;color:var(--greenText);margin-bottom:7px}
.post-content{font-size:14px;line-height:1.56;color:var(--ink);font-weight:400}
.post-meta{font-size:11.5px;color:var(--inkMute);margin-top:11px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}

.permalink{color:var(--greenText);text-decoration:none;cursor:pointer}
.permalink:hover{text-decoration:underline}
/* The permalink target is marked by the one border weight that is not decoration. */
.post-highlighted{border-color:var(--borderStrong)!important}
.thread-header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.thread-header h2{margin-bottom:0}
.ancestor-post{opacity:.72}
.ancestor-connector{color:var(--inkMute);font-size:11px;padding:2px 0 2px 12px;border-left:2px solid var(--border);margin-left:0}

@media(max-width:768px){
  body{flex-direction:column;height:auto;min-height:100vh;overflow:auto}
  .left{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);flex-shrink:0}
  .right{flex:none}
  .panel{overflow-y:visible}
}
</style>
</head>
<body>
<!-- Label and aria-label are set by the head script, which is the only thing that knows
     which theme is active. -->
<button class="theme-toggle" id="themeToggle"></button>

<div class="panel left">
  <div class="brand">
    <!-- Notis mark, micro tier (22px ≤ 32 — HOUSE_STYLE.md → The mark § Tiers: continuous
         ring with heads, N only). GENERATED ARTWORK - do not hand-edit. The build script
         that produced it is deliberately not in the repository; only its output is, so a
         change to the mark means regenerating it elsewhere, not patching the paths below.
         The parameters it was built from, so the drawing stays reproducible on paper:
         ring=continuous, keyline=off, banner=none, recursion=off.
         r_ring=372, stroke=64, head r=42 at radius 410, slit 3.2 deg.
         Inlined rather than referenced as an <img>, because custom properties do not cross

    <svg viewBox="0 0 1000 1000" aria-hidden="true"><g fill="none" stroke="var(--notis-green, #009B00)"><path d="M 128 500 A 372 372 0 1 0 872 500 A 372 372 0 1 0 128 500" stroke-width="64"/></g><g fill="var(--notis-green, #009B00)"><circle cx="500" cy="90" r="42"/><circle cx="855.07" cy="295" r="42"/><circle cx="855.07" cy="705" r="42"/><circle cx="500" cy="910" r="42"/><circle cx="144.93" cy="705" r="42"/><circle cx="144.93" cy="295" r="42"/></g><g transform="translate(302.34 247.97) scale(0.38218)" fill="var(--notis-green, #009B00)"><path d="M 291.49 52.04 L 279.19 60.04 L 0 1221.91 L 2.12 1236.43 L 156.3 1238.6 L 170.32 1234.11 L 355.22 617.08 L 364.03 604.41 L 374.69 616.29 L 651.51 1233.14 L 680.53 1238.49 L 768.58 1239.14 L 828.86 1238.01 L 840.28 1233.77 L 847.89 1214.23 L 1000 244.6 L 994.28 227.58 L 896.08 67.45 L 889.97 67.11 L 886.1 75.31 L 856.43 311.66 L 710.57 887.7 L 700.72 901.82 L 446.83 329.97 L 403.79 62.86 L 387.86 51.77 Z"/></g></svg>
    <b>Notis<i>//</i></b>
    <span class="tag"><u></u>testnet</span>
  </div>
  <h2>Identity</h2>
  <div class="row">
    <select id="identitySelect"></select>
  </div>
  <div class="row">

    <button id="importIdentityBtn" class="small">Import</button>
    <button id="exportIdentityBtn" class="small">Export</button>
  </div>
  <input type="file" id="importFileInput" accept=".json" style="display:none">

  <div class="status-bar" id="identityStatus" style="margin-top:8px">
    <div><span>Karma:</span> <strong id="identityKarma">—</strong></div>
    <div><span>Credits:</span> <strong id="identityCredits">—</strong></div>
  </div>

  <h2>Compose</h2>
  <textarea id="content" placeholder="What's on your mind?"></textarea>
  <input id="parents" placeholder="Parent post IDs (comma-separated, optional)">
  <div class="row">
    <button id="postBtn" disabled>Post</button>
    <span class="status" id="postStatus"></span>
  </div>

  <h2>Node Status</h2>
  <div class="status-bar" id="statusBar">Loading...</div>

  <div id="adminSection" style="display:none">
    <hr>

    <h3>Credit Transfer</h3>
    <div class="row">

    <h3>Invites</h3>
    <h4>Create (bond: 25 karma)</h4>

    <div class="row">

</div>

<div class="panel right">
  <div id="profileBar" class="status-bar" style="display:none;margin-bottom:12px;align-items:center;gap:8px">
    <span><strong id="profileName"></strong></span>
    <button id="vouchBtn" class="small" style="display:none">Vouch</button>
    <button id="unvouchBtn" class="small danger" style="display:none">Unvouch</button>
    <span id="vouchStatus" style="font-size:11px"></span>
    <button id="profileBackBtn" class="small" style="margin-left:auto">← All posts</button>
  </div>
  <h2>Feed <button id="feedFilterBtn" class="small" style="margin-left:8px;font-size:10px">All posts</button></h2>
  <div id="feed"><div class="empty">Loading...</div></div>
</div>

<script type="module">
import { blake2b } from 'https://cdn.jsdelivr.net/npm/blakejs@1.2.1/+esm';

// Auto-detect: behind nginx with /testnet/ prefix, or direct node access
const API = window.location.pathname.startsWith('/testnet') ? '/testnet/api' : '';
const encoder = new TextEncoder();

// ===========================================================================
// Protocol constants (mirrored from @dagsocial/types constants.ts)
// ===========================================================================

const PROTOCOL_VERSION = 1;
/**
 * How many parents a post may name — TYPES_INTERFACE → Content limits. The node
 * rejects anything wider, so the composer must refuse to mine one rather than
 * spend the PoW and have it bounced.
 */
const MAX_PARENT_REFS = 1;
// Amount constants are bigint (box values are bigint — TYPES_INTERFACE →
// Denomination); block counts stay plain numbers. Mirrors @dagsocial/types
// constants.ts.
const LIKE_KARMA_COST = 1n;
const POST_LOCK_THREAD_COST = 5n;
const POST_LOCK_REPLY_COST = 3n;
/**
 * The bond this page names on an invite, and therefore the karma the invitee
 * receives — **the grant EQUALS the bond** (ARCHITECTURE → Invite System).
 *
 * ⚠ **The page's choice, not a protocol constant.** The inviter picks any value
 * inside the network's `[inviteBondMin, inviteBondMax]` range, so this is a
 * default rather than a rule, and it is the one value the mirror checks the
 * node would accept.
 */
const INVITE_BOND_DEFAULT = 25n;
/**
 * The vouch stake, pinned at cast — NODE_INTERFACE → "Vouch transition rules".
 * A vouch is one vote and always stakes exactly this, so it is not a client
 * choice: `checkTransitions` rejects a VouchBox carrying any other value.
 */
const VOUCH_KARMA_AMOUNT = 1n;
/**
 * The karma floor a voucher must clear. The check here is advisory — `castVouch`
 * owns the verdict, and its message is what the button shows on a refusal.
 */
const VOUCH_MIN_BALANCE = 11n;
/** Credits are 8-decimal: 10⁸ base units (10⁻⁸ credit) per displayed credit. */
const CREDIT_SCALE = 100000000n;

/** JSON.stringify replacer: bigint → decimal string (JSON cannot carry bigint). */
function jsonBigint(_k, v) { return typeof v === 'bigint' ? v.toString() : v; }

/** Render credit base units as whole credits, trimming trailing zero decimals. */
function formatCredits(baseUnits) {
  const whole = baseUnits / CREDIT_SCALE;
  const frac = baseUnits % CREDIT_SCALE;
  if (frac === 0n) return whole.toString();
  return whole.toString() + '.' + frac.toString().padStart(8, '0').replace(/0+$/, '');
}

// ===========================================================================
// State
// ===========================================================================

const STORAGE_KEY = 'dagsocial-identities';
let identities = [];
let activeIndex = -1;
let userId, pubKeyRaw, privKey;
let networkType = 'mainnet';
/** Feed filter: 'all' or the hex userId to show only that author's posts. */
let feedFilter = 'all';
/** Set of post IDs with a pending like tx (spinner shown). */
const pendingLikes = new Set();
/** Current block height from /status */
let currentBlockHeight = 0;
/**
 * `NetworkProfile.vouchCooldownBlocks`, from /status.
 *
 * ⛔ **SERVED, NEVER A CONSTANT.** It is per-network, and the escrow an unvouch
 * outputs is pinned against `height + vouchCooldownBlocks`
 * (NODE_INTERFACE → Vouch transition rules) — a client holding the mainnet
 * number would be refused on devnet with a generic invalid-transition error and
 * no way to learn it guessed.
 *
 * The default is the mainnet value, matching `/challenge`'s discipline: on a
 * missing field the page overshoots the floor rather than undershooting it, and
 * only the floor is a rule.
 */
let vouchCooldownBlocks = 60;

// ===========================================================================
// Hex / byte utilities
// ===========================================================================

function buf2hex(buf) {
  return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
}

function hex2buf(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
  }
  return bytes;
}

function concatUint8Arrays(arrays) {
  const totalLength = arrays.reduce((s, a) => s + a.length, 0);
  const result = new Uint8Array(totalLength);
  let offset = 0;
  for (const a of arrays) {
    result.set(a, offset);
    offset += a.length;
  }
  return result;
}

// ===========================================================================
// Positional wire codec — hand-written mirror of @dagsocial/types src/codec.ts
// ===========================================================================
//
// Every consensus preimage below is written in ONE encoding language —
// TYPES_INTERFACE → Primitives: VLQ integers, raw bytes for ids, count-prefixed
// arrays, tagged options. One language for the whole file is the point; two
// dialects side by side is the drift this format exists to end.
//
// **Hand-written on purpose.** Importing the real library would remove the
// drift class this mirror polices, but it means giving `index.html` a build
// step, and the demo UI is scaffolding until `@dagsocial/web` lands. So the
// mirror and the test that polices it die together with the UI.
//
// A post mined here must verify on the node, so ANY change below must land in
// `packages/types/src/{codec,post,utxo}.ts` in the same commit. The frozen
// golden vectors in the types tests — re-asserted against this file by the node
// package's `ui-crypto-mirror` test, which extracts these declarations at
// runtime — are the anchor that catches drift. The anchor reaches exactly what
// that test extracts; what it deliberately does not reach is named in the same
// test's `AUDIT_ALLOW`, with a reason each.
//
// ## Totality, and where it stops — TYPES_INTERFACE → Totality
//
// Split exactly as the TS side splits it, because a mirror that threw where the
// node sentinels (or vice versa) would diverge on precisely the malformed input
// a light client is most likely to be handed:
//
//  - `vlqU`, `vlqS`, `lp`, `lpUtf8`, `arr`, `enum8Tag`, `boolByte` are TOTAL.
//    An out-of-domain value takes the all-ones sentinel, which is unreachable
//    from a well-formed field because the encodable domain (non-negative safe
//    integers, real byte lengths, a closed tag set) is narrower than the u64 or
//    byte wire domain it is written into.
//  - `vlqU64` (a bigint spans the whole u64) and the fixed-width `b32*` writers
//    (a 32-byte field's wire domain IS every 32-byte value) have no unreachable
//    sentinel, so they THROW. Padding a 31-byte key to 32 would map it onto a
//    well-formed key's encoding — a consensus collision, strictly worse than
//    the exception it would avoid.

const POST_ID_DOMAIN = encoder.encode('dagsocial/post-id/1');

/**
 * The all-ones u64 a total writer emits for a value it cannot encode:
 * `ff ff ff ff ff ff ff ff ff 01`, ten bytes. Unreachable from a well-formed
 * field — the encodable `number` domain tops out at 2⁵³−1.
 */
const VLQ_SENTINEL = 0xffffffffffffffffn;

function isEncodableVlqU(n) {
  return typeof n === 'number' && Number.isSafeInteger(n) && n >= 0;
}

/**
 * ZigZag doubles the magnitude before the VLQ sees it, so the faithful domain
 * is the values whose zigzag is still a safe integer.
 */
function isEncodableVlqS(n) {
  if (typeof n !== 'number' || !Number.isSafeInteger(n)) return false;
  const zz = n >= 0 ? n * 2 : -n * 2 - 1;
  return Number.isSafeInteger(zz);
}

/**
 * Base-128 VLQ over a bigint — the raw writer every numeric path funnels into,
 * mirroring `ByteWriter.writeVlqBigInt`. BigInt shifts are arbitrary-precision,
 * so unlike `>>>` they do not silently coerce to 32 bits.
 */
function vlqBigInt(value) {
  if (value < 0n || value > 0xffffffffffffffffn) {
    throw new Error('vlqBigInt: value outside u64: ' + value);
  }
  const out = [];
  let v = value;
  while (v >= 0x80n) { out.push(Number((v & 0x7fn) | 0x80n)); v >>= 7n; }
  out.push(Number(v));
  return new Uint8Array(out);
}

/**
 * vlqU(x) from a `number`. Total: sentinel, never throws.
 *
 * Arithmetic rather than bitwise, matching wire: `%`/`Math.floor` stay exact
 * past 2³², where `&`/`>>>` would truncate every timestamp.
 */
function vlqU(value) {
  if (!isEncodableVlqU(value)) return vlqBigInt(VLQ_SENTINEL);
  const out = [];
  let v = value;
  while (v >= 0x80) { out.push((v % 128) + 0x80); v = Math.floor(v / 128); }
  out.push(v);
  return new Uint8Array(out);
}

/** vlqS(x) — ZigZag VLQ from a `number`. Total: sentinel, never throws. */
function vlqS(value) {
  if (!isEncodableVlqS(value)) return vlqBigInt(VLQ_SENTINEL);
  return vlqU(value >= 0 ? value * 2 : -value * 2 - 1);
}

/**
 * vlqU(x) from a **bigint**, over the full u64. THROWS — a box `value` spans
 * the whole wire domain, so no sentinel is unreachable and writing one would
 * give a malformed box a well-formed box's id.
 */
function vlqU64(value) {
  if (typeof value !== 'bigint') throw new Error('vlqU64: not a bigint: ' + value);
  return vlqBigInt(value);
}

/** b32/b64 from a Uint8Array — exactly n raw bytes. THROWS. */
function b32Bytes(value, n) {
  if (!(value instanceof Uint8Array) || value.length !== n) {
    throw new Error('b32Bytes: expected ' + n + ' bytes, got ' +
      (value instanceof Uint8Array ? value.length : typeof value));
  }
  return value;
}

/**
 * b32/b64 from a lowercase-hex string — the hex→bytes half of the boundary.
 * THROWS. Lowercase only: 'AB…' and 'ab…' decode to identical bytes, so
 * accepting both would make the encoding non-injective at the hex boundary.
 */
function b32Hex(value, n) {
  if (typeof value !== 'string' || value.length !== n * 2 || !/^[0-9a-f]+$/.test(value)) {
    throw new Error('b32Hex: expected ' + (n * 2) + ' lowercase hex chars, got ' +
      (typeof value === 'string' ? value.length + ' chars' : typeof value));
  }
  return hex2buf(value);
}

/**
 * A fixed-width byte field in EITHER form. This page's tx builders carry keys
 * as hex strings (`pubKeyHex`, `inviteePubKeyHex`); @dagsocial/types holds the
 * same fields as `Uint8Array`. Both must reach the same 32 bytes, or one box
 * takes two ids. The TS side is stricter per field because its types are; this
 * is the one deliberate widening, and the mirror test is where the two forms
 * meet — it asserts they agree for every box type.
 */
function b32Either(value, n) {
  return value instanceof Uint8Array ? b32Bytes(value, n) : b32Hex(value, n);
}

/** lp(x) = vlqU(byteLength) ‖ bytes. Total: a non-view sentinels its length. */
function lp(bytes) {
  if (!(bytes instanceof Uint8Array)) return vlqBigInt(VLQ_SENTINEL);
  return concatUint8Arrays([vlqU(bytes.length), bytes]);
}

/**
 * lpUtf8(s) = vlqU(utf8ByteLength) ‖ utf8Bytes. Total by the same route.
 *
 * The type check is not decoration: `TextEncoder.encode` coerces through
 * `String()`, so without it `undefined` and the literal string "undefined"
 * produce identical bytes.
 */
function lpUtf8(value) {
  if (typeof value !== 'string') return vlqBigInt(VLQ_SENTINEL);
  const bytes = encoder.encode(value);
  return concatUint8Arrays([vlqU(bytes.length), bytes]);
}

/** arr(xs, f) = vlqU(count) ‖ f(x)… . Total: sentinel as the count. */
function arr(items, f) {
  if (!Array.isArray(items)) return vlqBigInt(VLQ_SENTINEL);
  const parts = [vlqU(items.length)];
  for (const item of items) parts.push(f(item));
  return concatUint8Arrays(parts);
}

/**
 * opt(x, f) — `00` absent, `01 ‖ f(x)` present. `undefined` counts as absent
 * alongside `null`, so an omitted optional field does not take the present
 * branch and serialize nothing after the tag.
 */
function opt(value, f) {
  if (value === null || value === undefined) return new Uint8Array([0]);
  return concatUint8Arrays([new Uint8Array([1]), f(value)]);
}

/** u8 from a boolean. Total: anything else takes the unreachable 0xff. */
function boolByte(value) {
  return new Uint8Array([value === true ? 1 : value === false ? 0 : 0xff]);
}

/**
 * A closed u8 tag table. Total: a value outside the table writes the reserved
 * 0xff, which no valid member may claim.
 *
 * **A tag is never renumbered** — TYPES_INTERFACE → Primitives. A renumber moves
 * every id carrying the tag with no signal, and here that is inside the id
 * preimage itself.
 */
function enum8Tag(table, value) {
  const has = typeof value === 'string' && Object.prototype.hasOwnProperty.call(table, value);
  return new Uint8Array([has ? table[value] : 0xff]);
}

/**
 * postFieldBytes — the canonical, injective encoding shared by the signing
 * hash, the PoW preimage, and the post id:
 *
 *   lpUtf8(content) ‖ b32(author) ‖ arr(parentRefs, b32)
 *     ‖ vlqU(protocolVersion) ‖ vlqU(timestamp)
 *
 * Field order IS the specification — reordering it is a consensus change with
 * no signal, so the calls below are laid out to be read line-by-line against
 * that table.
 *
 * ⛔ **These bytes are the post's payload inside its creating transaction** —
 * `txIdBytes` writes them as its `post` field, so they enter that transaction's
 * `TxId`. They are NOT the post id: a post's id comes from the transaction
 * (`computePostId(txId, index)`).
 *
 * **Injective** — TYPES_INTERFACE → Canonical field encoding. Every variable
 * field carries its own length or count, so no two distinct posts concatenate
 * to the same bytes; a parent ref crosses as the 32 raw bytes it names.
 */
function postFieldBytes(content, authorBytes, parentRefs, protocolVersion, timestamp) {
  return concatUint8Arrays([
    lpUtf8(content),
    // `b32Either`, because the page's identity carries `author` as hex text
    // while a decoded post carries bytes. Both produce the same 32 bytes, which
    // is what keeps the two entry points on one encoding rather than two.
    b32Either(authorBytes, 32),
    arr(parentRefs, (ref) => b32Hex(ref, 32)),
    vlqU(protocolVersion),
    vlqU(timestamp),
  ]);
}

// ===========================================================================
// canonicalBoxBytes — the single box→bytes rule both id functions use
// ===========================================================================

/**
 * The `boxType` tag table — the mirror of `enum8(boxType)` in
 * @dagsocial/types. **A tag is never renumbered:** it is the first byte of
 * every box's identity preimage, so moving a number silently moves every box id
 * and every `stateRoot` covering it.
 *
 * Complete rather than only what this page builds. `enum8Tag` falls back to the
 * reserved `0xff` for a type it does not know, and `boxTypeFields` then writes
 * no tail — so a missing entry does not throw, it derives a **wrong id that
 * looks well-formed**.
 *
 * ⛔ **TAG 2 IS A HOLE, AND IT STAYS ONE.** `invite` held it and the type is
 * gone; a tag is never renumbered and never reused, so the next box type takes
 * the lowest FREE number rather than the gap (TYPES_INTERFACE → InviteBox).
 * Filling it would give a new type the identity preimage of every historical
 * invite box.
 */
const BOX_TYPE_TAGS = { karma: 0, credit: 1, genesis_proof: 3, bond: 4, post_lock: 5, vouch: 6, emission: 7, treasury: 8, fee: 9, karma_pool: 10, like_accrual: 11, vouch_escrow: 12 };

/**
 * Byte-identical mirror of `canonicalBoxBytes` in @dagsocial/types
 * (src/utxo.ts) — TYPES_INTERFACE → Layout — Boxes.
 *
 *   enum8(boxType) ‖ vlqU64(value) ‖ <per-type>
 *
 * **Provenance is structurally absent**, not stripped at runtime: there is no
 * branch here that could write `id`/`txId`/`index`, so "provenance is not in
 * the candidate bytes" is a property of this encoder rather than a rule a
 * caller has to remember. `computeCandidateBoxId` binds provenance by appending
 * it *after* these bytes, which is what keeps the derivation non-circular. A
 * stray extra key a display path decorated a box with is unrepresentable for
 * the same reason — the encoder reads the fields it declares and nothing else.
 *
 * **Key order does not exist.** Field order is fixed by the calls below, so a
 * producer's own field order is not consensus-visible and no sorting pass is
 * required to make it so.
 *
 * Total for an unknown `boxType`: `enum8Tag` writes the reserved 0xff and no
 * per-type fields follow, so a malformed box still encodes and can never
 * collide with a well-formed one.
 */
function canonicalBoxBytes(box) {
  return concatUint8Arrays([
    enum8Tag(BOX_TYPE_TAGS, box.boxType),
    vlqU64(box.value),
    boxTypeFields(box),
  ]);
}

/** The per-type tail of `canonicalBoxBytes`. Field order is normative. */
function boxTypeFields(box) {
  switch (box.boxType) {
    case 'karma':
      return concatUint8Arrays([
        b32Either(box.owner, 32),
        opt(box.decayBurn, boolByte),
      ]);
    case 'credit':
      return concatUint8Arrays([
        b32Either(box.owner, 32),
        opt(box.lockedUntilBlock, vlqU),
      ]);
    case 'genesis_proof':
      // `lp`, not `b32Either`: the payload is variable-length and opaque to
      // consensus. No builder on this page carries one — the box is written by
      // genesis seeding alone — so there is no hex form to widen for, and `lp`
      // stays the byte-only primitive it is in @dagsocial/types.
      return lp(box.payload);
    case 'bond':
      // ⛔ **Byte-for-byte the `vouch` arm below** — two `b32` fields naming two
      // parties, in both cases. `enum8Tag(BOX_TYPE_TAGS, …)` is field 1, so the
      // tag is the whole of what separates the two leaves, and an encoder that
      // dropped it would give a bond and a vouch with the same parties one id.
      return concatUint8Arrays([
        b32Either(box.inviterId, 32),
        b32Either(box.inviteePublicKey, 32),
      ]);
    case 'post_lock':
      // No `targetPostId`: a post's id comes from the transaction that creates
      // this lock, so the field would have to be known before the `TxId` that
      // produces it — unbuildable (TYPES_INTERFACE → PostLockBox).
      return concatUint8Arrays([
        vlqU64(box.originalValue),
        b32Either(box.owner, 32),
      ]);
    case 'vouch':
      return concatUint8Arrays([
        b32Either(box.voucherId, 32),
        b32Either(box.targetId, 32),
      ]);
    case 'like_accrual':
      // ⛔ **`author` is attribution, not authorization** — no signature by it
      // unlocks the box, and only the block's settlement transaction consumes
      // one (TYPES_INTERFACE → LikeAccrualBox). The encoder makes no
      // distinction: it is a `b32` field like `vouch.targetId`, which names a
      // party that cannot spend either.
      return b32Either(box.author, 32);
    case 'vouch_escrow':
      return concatUint8Arrays([
        b32Either(box.owner, 32),
        // `vlqU`, total by sentinel, which is the standing every height in this
        // format has (TYPES_INTERFACE → Totality). Required rather than
        // optional, so there is no `opt` tag: an escrow always names the height
        // it releases at, and absence is not a state it has.
        vlqU(box.releaseAtBlock),
      ]);
    case 'emission':
    case 'treasury':
    case 'fee':
    case 'karma_pool':
      // **Empty on purpose, and not the same as the `default` below.** None of
      // the four has an owner — block application is their only spender — so
      // the shared prefix
      // `enum8(boxType) ‖ vlqU64(value)` is the whole encoding, and these are
      // the types whose content bytes carry no tail at all
      // (TYPES_INTERFACE → EmissionBox / TreasuryBox / FeeBox / KarmaPoolBox).
      // The `default` arm returns the same zero bytes after a *reserved 0xff*
      // tag; these return them after their own assigned tag, so the two can
      // never collide.
      return new Uint8Array(0);
    default:
      // Unreachable from a valid box. Returning rather than throwing is what
      // keeps this total: the reserved 0xff tag is already written, so there are
      // no declared fields to write and no well-formed box can produce these
      // bytes.
      return new Uint8Array(0);
  }
}

// ===========================================================================
// computeTxId (client-side, matches server @dagsocial/types computeTxId)
// ===========================================================================

/** Domain tag for the transaction-id preimage. Mirrors @dagsocial/types. */
const TX_ID_DOMAIN = encoder.encode('dagsocial/tx-id/1');

/**
 * Deterministic transaction ID:
 *   blake2b512( TX_ID_DOMAIN ‖ txIdBytes(tx) )[0:32]
 *
 *   | 1 | inputs          | arr(ids, b32)                                |
 *   | 2 | outputs         | arr(candidates, canonicalBoxBytes)           |
 *   | 3 | protocolVersion | vlqU                                         |
 *   | 4 | likeTarget      | opt(b32)                                     |
 *   | 5 | post            | opt(postFieldBytes)                          |
 *
 * Three properties this layout secures, each of which a bare concatenation
 * would not (TYPES_INTERFACE → Layout — UtxoTransaction):
 *
 *  - `inputs` and `outputs` each carry `arr()`'s count prefix. Box bytes are
 *    variable-length, so without it two different output lists could
 *    concatenate to identical bytes.
 *  - `protocolVersion` is `vlqU`. Unprefixed decimal text would run into the
 *    field beside it.
 *  - `likeTarget` and `post` presence is `opt()`'s 0/1 tag, which needs no
 *    in-band marker and preserves the `!== undefined` distinction. An
 *    empty-string target is out of the `b32` domain, so it has no encoding at
 *    all rather than a distinct one. ⛔ `post` needs no length prefix inside its
 *    `opt`: `postFieldBytes` is self-delimiting and it is last.
 *
 * Signatures are absent and stay absent: they are Ed25519 *over* this id.
 *
 * ⛔ **FIVE FIELDS, AND THE COUNT IS LOAD-BEARING.** `signTx` signs whatever this
 * returns, so a field here that the node does not write makes the browser sign
 * an id the node never computes — and **every transaction this page builds is
 * rejected**, with nothing in the repo able to see it (NODE_INTERFACE → the
 * demo UI is a second implementation of consensus rules).
 */
function computeTxId(tx) {
  const combined = concatUint8Arrays([
    TX_ID_DOMAIN,
    arr(tx.inputs, (input) => b32Hex(input, 32)),
    arr(tx.outputs, (output) => canonicalBoxBytes(output)),
    vlqU(tx.protocolVersion),
    opt(tx.likeTarget, (target) => b32Hex(target, 32)),
    // ⛔ The post payload, and this is what makes the post id derivable: a
    // transaction carrying a distinct post has a distinct id, and
    // `computePostId(txId, index)` inherits that uniqueness.
    opt(tx.post, (post) => postFieldBytes(
      post.content,
      typeof post.author === 'string' ? hex2buf(post.author) : post.author,
      post.parentRefs,
      post.protocolVersion,
      post.timestamp,
    )),
  ]);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// ===========================================================================
// Reserved, never to be reused: powTarget, meetsPowTarget, buildPowInput,
// powNonceTail, postPowHash, solvePoW, buildSignHashInput, signPost.
//
// ⛔ There is no post PoW and no post signature. A post is the payload of the
// transaction that locks its karma, and that transaction is signed over its
// `TxId` by the author (NODE_INTERFACE → Post transactions) — so `signTxId`
// below is the only signing this page does, and the relay gate is membership
// rather than burned milliseconds.
// ===========================================================================

// ===========================================================================
// Signing — txId-based (Ed25519 over computeTxId)
// ===========================================================================

/** Sign a txId hash with the current identity's Ed25519 private key. */
async function signTxId(tx) {
  const txId = computeTxId(tx);
  const txIdBytes = hex2buf(txId);
  const sig = await crypto.subtle.sign('Ed25519', privKey, txIdBytes);
  return { txId, signature: buf2hex(new Uint8Array(sig)) };
}

// ===========================================================================
// UTXO state fetching
// ===========================================================================

/**
 * The id of the box output `index` of `tx` will create.
 *
 * The page computes `txId` itself in order to sign, and a box id is a function
 * of the candidate plus that `txId` and the index — so the id of a box a
 * transaction has not been submitted yet is already determined, with no
 * round-trip. `computeCandidateBoxId` is the single derivation both sides share.
 */
function predictOutputBoxId(tx, index) {
  return computeCandidateBoxId(tx.outputs[index], computeTxId(tx), index);
}

/**
 * Karma change boxes this page's own submitted transactions will create, keyed
 * by the box each one supersedes.
 *
 * `GET /karma` answers from the confirmed set, so between submitting a
 * transaction and its block landing the server still reports the box that
 * transaction spends. Building the next transaction from that answer names an
 * input the first one consumes: both reach one block, the first spends the box,
 * and the second cannot apply. Posting and then liking inside one block interval
 * is an ordinary sequence, and that is exactly the pair it produces.
 *
 * So the page spends its own change instead. The node admits this — its
 * admission resolves inputs against pending outputs too — and the apply path's
 * dependency ordering settles the whole chain in one block.
 */
const pendingKarmaChange = new Map();

/**
 * Record the karma change a submitted transaction will create.
 *
 * Every karma-spending builder on this page puts its change at output 0, and
 * calling this after a successful submit — rather than inside the builders — is
 * what keeps a transaction the server refused out of the map.
 */
function recordPendingKarmaChange(tx) {
  const change = { boxId: predictOutputBoxId(tx, 0), value: tx.outputs[0].value };
  for (const spentId of tx.inputs) pendingKarmaChange.set(spentId, change);
}

/**
 * Walk each confirmed box forward through the pending changes to the box that
 * is actually spendable, and forget the entries the server has caught up with.
 *
 * Mirrors what the node does when it selects boxes for its own transactions.
 */
function applyPendingKarmaChange(data) {
  const confirmed = new Set(data.boxes.map(b => b.boxId));
  for (const [spentId, change] of pendingKarmaChange) {
    if (confirmed.has(change.boxId)) pendingKarmaChange.delete(spentId);
  }

  const tips = new Map();
  for (const box of data.boxes) {
    let current = box;
    // Output ids are hashes of their transaction, so a chain cannot close on
    // itself; the set makes that a local guarantee rather than an assumption.
    const seen = new Set();
    while (pendingKarmaChange.has(current.boxId) && !seen.has(current.boxId)) {
      seen.add(current.boxId);
      current = pendingKarmaChange.get(current.boxId);
    }
    tips.set(current.boxId, current);
  }

  data.boxes = [...tips.values()].sort((a, b) => (b.value > a.value ? 1 : b.value < a.value ? -1 : 0));
  data.total = data.boxes.reduce((sum, b) => sum + b.value, 0n);
  return data;
}

/**
 * Fetch all karma boxes for the active identity.
 * Returns { total, boxes: [{ boxId, value }] } with total/value as bigint
 * (the API serializes them as decimal strings — JSON cannot carry a bigint).
 *
 * Boxes this page's own pending transactions supersede are replaced by the
 * change they create, so the next transaction chains rather than re-spending.
 */
async function fetchKarmaBox() {
  if (!userId) return null;
  try {
    const res = await fetch(API + '/karma/' + encodeURIComponent(userId));
    if (!res.ok) return null;
    const data = await res.json(); // { userId, total, boxes: [{ boxId, value }] }
    data.total = BigInt(data.total);
    for (const b of data.boxes) b.value = BigInt(b.value);
    return applyPendingKarmaChange(data);
  } catch {
    return null;
  }
}

/**
 * Largest-first UTXO selection. Returns boxes whose combined value covers
 * requiredAmount. Assumes boxes are sorted value descending (server does this).
 * Throws if total is insufficient.
 */
function selectBoxes(boxes, requiredAmount) {
  if (requiredAmount <= 0n) return [];
  let accumulated = 0n;
  const selected = [];
  for (const box of boxes) {
    accumulated += box.value;
    selected.push(box);
    if (accumulated >= requiredAmount) break;
  }
  if (accumulated < requiredAmount) {
    throw new Error(`Insufficient total value: need ${requiredAmount}, have ${accumulated}`);
  }
  return selected;
}

async function fetchCreditBoxes() {
  if (!userId) return null;
  try {
    const res = await fetch(API + '/credits/' + encodeURIComponent(userId));
    if (!res.ok) return null;
    const data = await res.json(); // { userId, total, boxes: [{ boxId, value, lockedUntilBlock? }] }
    data.total = BigInt(data.total);
    for (const b of data.boxes) b.value = BigInt(b.value);
    return data;
  } catch {
    return null;
  }
}

/**
 * The open invites and bonds the active identity holds as inviter.
 *
 * An invite has no expiry, so **open is the whole of its life** apart from
 * claimed and cancelled — which is why the endpoint names the arm `open`
 * (NODE_INTERFACE → UTXO queries).
 */
async function fetchInviteState() {
  if (!userId) return { open: [], bonds: [] };
  try {
    const res = await fetch(API + '/invites/' + encodeURIComponent(userId));
    if (!res.ok) return { open: [], bonds: [] };
    const data = await res.json(); // { open: InviteBox[], bonds: BondBox[] }
    for (const b of data.open) b.value = BigInt(b.value);
    for (const b of data.bonds) b.value = BigInt(b.value);
    return data;
  } catch {
    return { open: [], bonds: [] };
  }
}

// ===========================================================================
// Tx construction helpers
// ===========================================================================

/** Build the karma-lock tx for post creation. Uses all boxes needed to cover lockAmount. */
function buildPostTx(karmaBox, lockAmount, post, pubKeyHex) {
  const selected = selectBoxes(karmaBox.boxes, lockAmount);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const newKarmaValue = selectedTotal - lockAmount;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    owner: pubKeyHex,
  };

  const postLockOutput = {
    boxType: 'post_lock',
    value: lockAmount,
    originalValue: lockAmount,
    owner: pubKeyHex,
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, postLockOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
    // ⛔ The post rides INSIDE the transaction. `postFieldBytes` is in the
    // `computeTxId` preimage, so the signature covers the post — a relay cannot
    // rewrite it any more than it can re-point a like — and the id the page
    // predicts below is derived from that same transaction.
    post,
  };
}

/**
 * Build a like tx: karma boxes in, one karma box out at
 * `total − LIKE_KARMA_COST`, one `LikeAccrualBox` marker carrying that cost,
 * and `likeTarget` naming the post.
 *
 * ⛔ **THE LIKE CONSERVES — there is no deficit.** Its cost moves into a marker
 * earmarked for the author rather than leaving the ledger, and the block's
 * settlement pays it out: per `x` likes the author receives `x − 1` and the
 * remainder returns to the karma pool (ARCHITECTURE → The conservation axiom,
 * third shape; ARCHITECTURE → Likes). ⚠ **A marker MUST carry its value** — a
 * zero-value one would mean the karma ceased to exist between this transaction
 * and the settlement.
 *
 * ⛔ **`author` MUST BE THE CONSENSUS AUTHOR, from `confirmedAuthor`.** The
 * engine pins the marker against `block_topology`, so a marker built from the
 * feed's `author` — the DAG's field — is refused, and a placeholder row carries
 * a ZEROED author, which would earmark the liker's karma to the zero key
 * (NODE_INTERFACE → Karma transition rules). The caller resolves it and this
 * function will not guess.
 *
 * `computeTxId` writes `likeTarget` as `opt(b32)`, so the target is inside the
 * bytes the signature covers and a relay cannot re-point the like.
 */
function buildLikeTx(karmaBox, targetPostId, pubKeyHex, authorHex) {
  const selected = selectBoxes(karmaBox.boxes, LIKE_KARMA_COST);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);
  const newKarmaValue = selectedTotal - LIKE_KARMA_COST;

  const karmaOutput = {
    boxType: 'karma',
    value: newKarmaValue,
    owner: pubKeyHex,
  };

  const accrualOutput = {
    boxType: 'like_accrual',
    value: LIKE_KARMA_COST,
    author: authorHex,
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, accrualOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
    likeTarget: targetPostId,
  };
}

/**
 * Build an invite tx: karma boxes → karma(change) + bond.
 *
 * ⛔ **TWO OUTPUTS, AND THE BOND IS THE WHOLE REQUEST.** The invite is one
 * transaction — there is no claim and no cancel — so the bond carries the
 * invitee's key and the block's settlement grants them **the bond's own value**
 * out of the karma pool (ARCHITECTURE → Invite System).
 *
 * **The inviter pays only the bond**, and the grant is a pool spend rather than
 * a mint, so this transaction conserves value like any other
 * (ARCHITECTURE → The conservation axiom).
 *
 * The invitee's key is supplied out of band and there is no secret anywhere in
 * the flow: each party proves who they are with an ordinary Ed25519 signature.
 */
function buildCreateInviteTx(karmaBox, pubKeyHex, inviteePubKeyHex) {
  const selected = selectBoxes(karmaBox.boxes, INVITE_BOND_DEFAULT);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);

  const karmaOutput = {
    boxType: 'karma',
    value: selectedTotal - INVITE_BOND_DEFAULT,
    owner: pubKeyHex,
  };

  // The bond is the whole cost of an invite and the network's only sybil price.
  // No user transaction consumes it at all: block application settles it at the
  // probation deadline, returning the vested part to the inviter and the
  // remainder to the karma pool (TYPES_INTERFACE → BondBox;
  // ARCHITECTURE → Bond outcomes).
  //
  // ⛔ **`inviteePublicKey` is what the settlement grants against.** One bond is
  // one grant, so this field is the whole of the request the block reads.
  const bondOutput = {
    boxType: 'bond',
    value: INVITE_BOND_DEFAULT,
    inviterId: pubKeyHex,
    inviteePublicKey: inviteePubKeyHex,
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, bondOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an invite-claim tx: one InviteBox → one KarmaBox holding the bond's
 * value, owned by the invitee, who signs.
 *
 * ⛔ **This transaction does not balance, and must not be made to.** The invite
 * holds `0`, so the whole output is a **surplus** — the only karma any
 * transaction may create — and the conservation gate admits it in this shape and
 * no other (ARCHITECTURE → Invite claim).
 *
 * **The bond is not an input.** Nothing user-signed can spend one; block
 * application settles it at the probation deadline the claim starts.
 */
function buildClaimInviteTx(inviteBoxId, inviteePubKeyHex) {
  const karmaOutput = {
    boxType: 'karma',
    value: INVITE_BOND_DEFAULT,
    owner: inviteePubKeyHex,
  };

  return {
    inputs: [inviteBoxId],
    outputs: [karmaOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an invite-cancel tx: one InviteBox → nothing. The inviter signs.
 *
 * **Zero outputs is the shape, not an omission.** The box holds `0`, so this
 * conserves, and the bond returns to the inviter through block application,
 * resolved by `inviteePublicKey` — this transaction neither names the bond nor
 * could spend it (ARCHITECTURE → Invite cancellation).
 */
function buildCancelInviteTx(inviteBoxId) {
  return {
    inputs: [inviteBoxId],
    outputs: [],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build a vouch-cast tx: karma boxes → karma(change) + vouch.
 *
 * The three fields consensus pins, all in NODE_INTERFACE → "Vouch transition
 * rules": the stake is exactly `VOUCH_KARMA_AMOUNT`, `voucherId` is the karma
 * input's owner, and the shape is exactly one karma output plus one vouch
 * output. `targetId` is the only free field.
 *
 * `voucherId` and `targetId` go out as hex, like every other binary field this
 * page sends — `jsonToTx`'s `BINARY_BOX_FIELDS` names both, and the mirror in
 * `boxTypeFields` encodes them through `b32Either`, so the id the node derives
 * is the one this page signed.
 */
function buildVouchTx(karmaBox, targetIdHex, pubKeyHex) {
  const selected = selectBoxes(karmaBox.boxes, VOUCH_KARMA_AMOUNT);
  const selectedTotal = selected.reduce((sum, b) => sum + b.value, 0n);

  const karmaOutput = {
    boxType: 'karma',
    value: selectedTotal - VOUCH_KARMA_AMOUNT,
    owner: pubKeyHex,
  };

  const vouchOutput = {
    boxType: 'vouch',
    value: VOUCH_KARMA_AMOUNT,
    voucherId: pubKeyHex,
    targetId: targetIdHex,
  };

  return {
    inputs: selected.map(b => b.boxId),
    outputs: [karmaOutput, vouchOutput],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

/**
 * Build an unvouch tx: one VouchBox → one VouchEscrowBox.
 *
 * ⛔ **THE STAKE IS HELD, NOT DESTROYED.** The escrow is an ordinary output of
 * this transaction, so both ends are named inside it and the transaction
 * conserves like any other (ARCHITECTURE → Vouch boxes; ARCHITECTURE → How a
 * source and a sink get named, first shape). `checkTransitions` requires
 * exactly one VouchBox input and exactly one `vouch_escrow` output.
 *
 * ⛔ **`value` IS THE CONSUMED BOX'S, never `VOUCH_KARMA_AMOUNT`.** The round
 * trip has to be conservation-**structural** rather than true by coincidence of
 * the cast pin holding for the box in hand (TYPES_INTERFACE → VouchEscrowBox).
 *
 * ⚠ **`releaseAtBlock` is pinned by a FLOOR, not an equality.** A transaction
 * cannot commit to the height of the block that will carry it, so the engine
 * requires only `>= height + vouchCooldownBlocks`
 * (NODE_INTERFACE → Vouch transition rules). Releasing late costs only the
 * voucher; releasing early is what the cooldown exists to prevent.
 *
 * ⛔ **Every input is a PARAMETER, none a page global.** The caller resolves the
 * box id, the stake and the release height, so this function is a pure
 * `tx → bytes` mirror the crypto suite can lift and check — a builder closing
 * over `currentBlockHeight` would be unreachable from the only gate this file
 * has (NODE_INTERFACE → the demo UI is a second implementation of consensus
 * rules).
 *
 * The box id and its value are not derivable client-side — both come from
 * `GET /vouches?voucher=<hex>`, the one read surface that names them.
 */
function buildUnvouchTx(vouchBoxId, stakeValue, pubKeyHex, releaseAtBlock) {
  return {
    inputs: [vouchBoxId],
    outputs: [{
      boxType: 'vouch_escrow',
      value: stakeValue,
      owner: pubKeyHex,
      releaseAtBlock,
    }],
    signatures: {},
    protocolVersion: PROTOCOL_VERSION,
  };
}

// ===========================================================================
// Box identity (client-side, matches server @dagsocial/types)
// ===========================================================================

/** Domain tag for the box-id preimage. Mirrors @dagsocial/types. */
const BOX_ID_DOMAIN = encoder.encode('dagsocial/box-id/1');

/**
 * Box id of a box that already carries its provenance — the mirror of
 * `computeBoxId` in @dagsocial/types.
 *
 * Exactly `computeCandidateBoxId` applied to the box's own `txId`/`index`, so
 * there is one derivation on both sides rather than two. Both sides move
 * together or not at all: a client that derives an id the node disagrees with
 * gets no error, only a box neither can spend.
 */
function computeBoxId(box) {
  return computeCandidateBoxId(box, box.txId, box.index);
}

/**
 * Box id, derived from creating-transaction provenance — TYPES_INTERFACE →
 * BoxId:
 *
 *   blake2b512( BOX_ID_DOMAIN ‖ boxRecordBytes )[0:32]
 *   boxRecordBytes = canonicalBoxBytes(candidate) ‖ b32(txId) ‖ vlqU(index)
 *
 * This is the single derivation — `computeBoxId` above delegates to it. No flow
 * on this page predicts a box id: the invite flow's bond names an output index
 * instead (user decision, 2026-08-06), and a like is a one-way burn transaction
 * rather than a box. The pair is here so the mirror test can hold it to
 * @dagsocial/types before a flow needs it.
 *
 * **`txId` crosses as 32 raw bytes, not as the UTF-8 of its hex text.** Two
 * properties a text encoding would give for free are secured elsewhere instead:
 *
 *  - *Totality.* A hex decode throws on a malformed `txId`, so text would keep
 *    this function total by itself. `b32Hex` throws, and the domain is
 *    established at the call site instead: every `txId` reaching here is a
 *    blake2b digest rendered with `buf2hex`, so it is 64 lowercase hex by
 *    construction. A throwing writer with an established domain is this
 *    format's standard trade (TYPES_INTERFACE → Totality).
 *  - *Injectivity.* A decode would map `AB…` and `ab…` onto one id. `b32Hex`
 *    accepts lowercase only, so an uppercase id has **no encoding at all**
 *    instead of sharing one.
 *
 * `index` is `vlqU`, total by sentinel — an out-of-domain index cannot panic
 * this function and cannot impersonate a valid one.
 */
function computeCandidateBoxId(candidate, txId, index) {
  const combined = concatUint8Arrays([
    BOX_ID_DOMAIN,
    canonicalBoxBytes(candidate),
    b32Hex(txId, 32),
    vlqU(index),
  ]);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

// ===========================================================================
// Post ID computation (client-side, matches server computePostId)
// ===========================================================================

/**
 * `u32BE(n)` — 4 bytes big-endian, TOTAL by sentinel.
 *
 * Mirrors `u32BE` in `@dagsocial/types`. A value outside the encodable domain
 * writes the all-ones sentinel rather than throwing, so a malformed index can
 * never turn id derivation into a page exception — the same M-5 no-panic rule
 * the numeric writers above follow. A mirror that threw would diverge.
 */
const U32_SENTINEL = 0xffffffff;
function u32BE(n) {
  const encodable = typeof n === 'number' && Number.isSafeInteger(n) && n >= 0 && n < U32_SENTINEL;
  const v = encodable ? n : U32_SENTINEL;
  return new Uint8Array([(v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff]);
}

/**
 * postId = blake2b512(POST_ID_DOMAIN ‖ utf8(txId) ‖ u32BE(index))[0..32]
 *
 * ⛔ **Provenance-derived, and neither argument is a post.** The creating
 * transaction spends the author's karma box, so `(txId, index)` names a post
 * uniquely by construction (TYPES_INTERFACE → Hashing functions). The page must
 * therefore build the transaction BEFORE it can name the post — the ordering
 * inverts, and optimistic display still works because `computeTxId` is local.
 *
 * ⚠ `utf8(txId)`, not decoded bytes, and `u32BE` for the index — both are
 * about totality: this runs on ids the page did not produce, and a hex decode
 * throws on a malformed one.
 */
function computePostId(txId, index) {
  const combined = concatUint8Arrays([
    POST_ID_DOMAIN,
    encoder.encode(txId),
    u32BE(index),
  ]);
  const hash = blake2b(combined, null, 64).slice(0, 32);
  return buf2hex(hash);
}

function setStatus(text, cls) {
  const s = document.getElementById('postStatus');
  s.textContent = text; s.className = 'status status-' + (cls || 'busy');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escWithBreaks(s) { return esc(s).replace(/\n/g, '<br>'); }

// ===========================================================================
// Identity management
// ===========================================================================

function refreshIdentityDropdown() {
  const sel = document.getElementById('identitySelect');
  sel.innerHTML = identities.map((ident, i) => {
    const shortPub = ident.pubKeyHex.slice(0, 12) + '...';
    return `<option value="${i}">Identity ${i + 1} (${shortPub})</option>`;
  }).join('');
  if (activeIndex >= 0 && activeIndex < identities.length) {
    sel.value = activeIndex;
  }
}

async function activateIdentity(index) {
  if (index < 0 || index >= identities.length) return;

  activeIndex = index;
  const ident = identities[index];
  pubKeyRaw = hex2buf(ident.pubKeyHex);

  // Decode PKCS8 private key from base64
  const privBytes = Uint8Array.from(atob(ident.privKeyBase64), c => c.charCodeAt(0));
  privKey = await crypto.subtle.importKey('pkcs8', privBytes, 'Ed25519', true, ['sign']);

  // userId IS the hex-encoded public key
  userId = ident.pubKeyHex;

  // Update UI
  document.getElementById('identitySelect').value = index;
  document.getElementById('currentUserId').textContent = userId;
  document.getElementById('postBtn').disabled = false;

  // Clear per-session tracking for this identity
  pendingLikes.clear();

  // Load per-identity balances
  loadIdentityStatus();

  // Reload feed
  loadFeed();
}

async function createIdentity() {
  // Generate keypair
  const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
  const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
  const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
  const privKeyBase64 = btoa(String.fromCharCode(...privBytes));

  // Save to localStorage
  identities.push({ pubKeyHex, privKeyBase64 });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

  // Refresh dropdown and switch to new identity
  refreshIdentityDropdown();
  await activateIdentity(identities.length - 1);
}

function exportIdentity() {
  if (activeIndex < 0 || activeIndex >= identities.length) return;
  const ident = identities[activeIndex];
  const json = JSON.stringify({ pubKeyHex: ident.pubKeyHex, privKeyBase64: ident.privKeyBase64 });
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dagsocial-identity.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importIdentityFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.pubKeyHex || !data.privKeyBase64) {
        alert('Invalid identity file: missing pubKeyHex or privKeyBase64');
        return;
      }
      if (!/^[0-9a-f]{64}$/i.test(data.pubKeyHex)) {
        alert('Invalid identity file: pubKeyHex must be 64 hex chars');
        return;
      }

      // Check for duplicates
      if (identities.some(i => i.pubKeyHex === data.pubKeyHex)) {
        alert('This identity is already in your list');
        return;
      }

      // Save to localStorage
      identities.push({ pubKeyHex: data.pubKeyHex, privKeyBase64: data.privKeyBase64 });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));

      // Refresh dropdown
      refreshIdentityDropdown();
    } catch (e) {
      alert('Failed to parse identity file: ' + e.message);
    }
  };
  reader.readAsText(file);
}

async function loadIdentities() {
  // Read from localStorage
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      identities = JSON.parse(stored);
      if (!Array.isArray(identities)) identities = [];
    } catch {
      identities = [];
    }
  }

  // If empty, auto-generate one
  if (identities.length === 0) {
    const key = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
    const pubKeyHex = buf2hex(new Uint8Array(await crypto.subtle.exportKey('raw', key.publicKey)));
    const privBytes = new Uint8Array(await crypto.subtle.exportKey('pkcs8', key.privateKey));
    const privKeyBase64 = btoa(String.fromCharCode(...privBytes));
    identities = [{ pubKeyHex, privKeyBase64 }];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(identities));
  }

  // Populate dropdown
  refreshIdentityDropdown();

  // Activate first identity
  await activateIdentity(0);
}

// Identity UI event handlers
document.getElementById('identitySelect').addEventListener('change', async () => {
  const index = parseInt(document.getElementById('identitySelect').value);

});

document.getElementById('newIdentityBtn').addEventListener('click', async () => {

document.getElementById('exportIdentityBtn').addEventListener('click', () => {

document.getElementById('importIdentityBtn').addEventListener('click', () => {

});

// ===========================================================================
// Post flow (with karma-lock tx)
// ===========================================================================

document.getElementById('postBtn').addEventListener('click', async () => {
  const btn = document.getElementById('postBtn');
  const content = document.getElementById('content').value.trim();
  if (!content) return;

  btn.disabled = true;
  try {
    // 1. Fetch current karma box
    const karmaBox = await fetchKarmaBox();
    if (!karmaBox) {
      setStatus('No karma box found — this identity needs an invite from a member', 'error');
      return;
    }

    // 2. Validate parent refs before anything hashes them
    const parentRefs = document.getElementById('parents').value
      .split(',').map(s => s.trim()).filter(Boolean);
    // `b32Hex` has no encoding for a ref that is not 64 lowercase hex, so the
    // alternative to refusing here is an exception out of `computeTxId`.
    if (parentRefs.length > MAX_PARENT_REFS) {
      setStatus(`at most ${MAX_PARENT_REFS} parent ref (got ${parentRefs.length})`, 'error');
      return;
    }
    if (parentRefs.some(r => !/^[0-9a-f]{64}$/.test(r))) {
      setStatus('each parent ref must be 64 lowercase hex characters', 'error');
      return;
    }

    // 3. Determine lock amount
    const lockAmount = parentRefs.length === 0 ? POST_LOCK_THREAD_COST : POST_LOCK_REPLY_COST;
    if (karmaBox.total < lockAmount) {
      setStatus(`Insufficient karma: need ${lockAmount}, have ${karmaBox.total}`, 'error');
      return;
    }

    // 4. Build the post payload — no challenge, no nonce, no signature of its own
    const post = {
      content,
      author: userId,
      parentRefs,
      protocolVersion: PROTOCOL_VERSION,
      timestamp: Date.now(),
    };

    // 5. Build and sign ONE transaction carrying that payload
    setStatus('building post transaction...', 'busy');
    const pubKeyHex = buf2hex(pubKeyRaw);
    const tx = buildPostTx(karmaBox, lockAmount, post, pubKeyHex);
    const { txId, signature: txSig } = await signTxId(tx);
    tx.signatures[pubKeyHex] = txSig;

    // 6. ⛔ Name the post from the transaction — the ordering that option (C)
    //    inverts. Optimistic display still works because `computeTxId` is local;
    //    what changed is that the transaction must exist first.
    const postId = computePostId(txId, 0);
    console.log('[client] txId:', txId, 'postId:', postId);

    // 7. Submit the one transaction
    setStatus('posting...', 'busy');
    const postRes = await fetch(API + '/posts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx }, jsonBigint),
    });
    if (!postRes.ok) {
      const err = await postRes.json();
      setStatus(err.error || 'post failed', 'error');
      return;
    }
    const posted = await postRes.json();
    // The lock is pending now, so a like on the next click must spend this
    // transaction's change rather than the box it just consumed.
    recordPendingKarmaChange(tx);
    setStatus('posted! ' + posted.postId.slice(0, 12) + '...', 'ok');
    document.getElementById('content').value = '';
    document.getElementById('parents').value = '';
    loadFeed();
    loadIdentityStatus();
  } catch (e) {
    setStatus('error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});
