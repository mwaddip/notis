<meta charset="utf-8">
<title>Notis — social preview card</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Rendered at exactly 1200x630 by headless Firefox, which is how the real face gets
     used — no system font install needed, and no text-to-path conversion. */
  :root{
    --ground:#E7DCC6; --ink:#2A2419; --inkMute:#696051;
    --green:#5E8C3A; --greenText:#476A2C; --keyline:#1B2A12;
    --sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);
       display:flex;align-items:center;gap:64px;padding:0 88px;-webkit-font-smoothing:antialiased}
  .mark{flex:none}
  .mark svg{width:248px;height:248px;display:block}
  /* Explicit width: left to flex, the column shrinks and the headline wraps to three lines. */
  .txt{width:712px;flex:none}
  .kick{font-family:var(--mono);font-size:17px;letter-spacing:.19em;text-transform:uppercase;
        color:var(--greenText);margin-bottom:22px;white-space:nowrap}
  h1{font-size:72px;line-height:1.04;letter-spacing:-.025em;font-weight:700;margin-bottom:24px;
     white-space:nowrap}
  p{font-size:25px;line-height:1.4;color:var(--inkMute)}
  .foot{position:absolute;left:88px;bottom:54px;font-family:var(--mono);font-size:20px;
        letter-spacing:.1em;color:var(--inkMute)}
  .foot b{color:var(--ink);font-weight:500}
</style>
