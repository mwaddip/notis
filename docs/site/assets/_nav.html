     editing this file once. Do not inline any of it into a page; it will silently drift.

     Never write an SSI include directive in this file, not even inside a comment. nginx
     resolves includes recursively and does not care that one is quoted, so a directive here
     naming this file would include it into itself; and because HTML comments do not nest, the
     one that quotes it also ends at the quoted directive's own terminator, spilling the rest
     of the comment onto the page as text.
