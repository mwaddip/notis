packages:
  - 'packages/*'
  - 'tools/*'

# better-sqlite3 ships a prebuild for every platform; no install builds it.
onlyBuiltDependencies:
  - cbor-extract
  - esbuild

ignoredBuiltDependencies:
  - better-sqlite3

# pnpm v11 build approvals (required for non-interactive CI builds)
allowBuilds:
  better-sqlite3: false
  cbor-extract: true
  esbuild: true
